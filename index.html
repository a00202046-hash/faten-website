<title>NOVA | نوفا</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Noto+Sans+Arabic:wght@300;400;500;600;700;800&display=swap');

:root{
  --bg: #141B33;
  --bg-deep: #0F1526;
  --card: #1D2745;
  --card-hover: #22305A;
  --gold: #D4AF37;
  --gold-soft: #E9CE7C;
  --teal: #4C9184;
  --teal-soft: #6FB2A4;
  --rose: #C97064;
  --blue: #5C86B8;
  --ivory: #F3EFE2;
  --muted: #9AA3C4;
  --line: rgba(212,175,55,0.18);
  --radius: 18px;
  --period-glow-1: rgba(212,175,55,0.10);
  --period-glow-2: rgba(76,145,132,0.10);
}
[data-period="dawn"]{ --period-glow-1: rgba(233,150,122,0.16); --period-glow-2: rgba(212,175,55,0.08); }
[data-period="morning"]{ --period-glow-1: rgba(212,175,55,0.13); --period-glow-2: rgba(76,145,132,0.08); }
[data-period="afternoon"]{ --period-glow-1: rgba(212,150,55,0.13); --period-glow-2: rgba(76,145,132,0.07); }
[data-period="sunset"]{ --period-glow-1: rgba(201,112,100,0.18); --period-glow-2: rgba(92,134,184,0.09); }
[data-period="night"]{ --period-glow-1: rgba(92,134,184,0.11); --period-glow-2: rgba(76,145,132,0.10); }

*{box-sizing:border-box; margin:0; padding:0;}

:root[data-theme="light"]{
  --bg-deep: #FAF7EF;
  --card: #FFFFFF;
  --card-hover: #F6F0E2;
  --gold: #9C6B12;
  --gold-soft: #7A5209;
  --teal: #2F6F63;
  --teal-soft: #245951;
  --rose: #B5574A;
  --blue: #3F6A9C;
  --ivory: #2A2E3D;
  --muted: #6A6F80;
  --line: rgba(122,82,9,0.16);
}
:root[data-theme="light"] audio{ filter:none; }
:root[data-theme="light"] .card{ box-shadow: 0 2px 10px rgba(60,40,10,0.05); }
:root[data-theme="light"] h1{ text-shadow:none; }
:root[data-theme="light"] .arc-box{ background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(250,247,239,0.5)); }
:root[data-theme="light"] .icon,
:root[data-theme="light"] .btn,
:root[data-theme="light"] .tab.active,
:root[data-theme="light"] .cal-nav button,
:root[data-theme="light"] .theme-toggle{
  background: rgba(156,107,18,0.09); border-color: rgba(156,107,18,0.25);
}
:root[data-theme="light"] .btn:hover,
:root[data-theme="light"] .theme-toggle:hover{ background: rgba(156,107,18,0.16); }
:root[data-theme="light"] .btn.teal{ background: rgba(47,111,99,0.10); border-color: rgba(47,111,99,0.28); }
:root[data-theme="light"] .btn.teal:hover{ background: rgba(47,111,99,0.18); }
:root[data-theme="light"] .tab{ background: rgba(0,0,0,0.03); }
:root[data-theme="light"] input[type=text], :root[data-theme="light"] input[type=number],
:root[data-theme="light"] input[type=url], :root[data-theme="light"] select,
:root[data-theme="light"] .cal-editor textarea{
  background: rgba(0,0,0,0.03);
}
:root[data-theme="light"] .cal-editor{ background: rgba(0,0,0,0.03); }
:root[data-theme="light"] .day-stats{ background: rgba(0,0,0,0.04); }
:root[data-theme="light"] .row{ border-bottom-color: rgba(0,0,0,0.07); }
:root[data-theme="light"] .book-item, :root[data-theme="light"] .pod-item{ border-bottom-color: rgba(0,0,0,0.07); }
:root[data-theme="light"] .progress-track{ background: rgba(0,0,0,0.07); }


body{
  background:
    radial-gradient(ellipse at 20% -10%, var(--period-glow-1), transparent 45%),
    radial-gradient(ellipse at 100% 0%, var(--period-glow-2), transparent 40%),
    var(--bg-deep);
  transition: background 1.5s ease;
  color: var(--ivory);
  font-family: 'Noto Sans Arabic', sans-serif;
  min-height: 100vh;
  padding: 28px 16px 60px;
}

.wrap{ max-width: 1000px; margin: 0 auto; }

header{ text-align:center; margin-bottom: 22px; position:relative; }
.theme-toggle{
  position:absolute; top:0; left:0;
  width:38px; height:38px; border-radius:10px;
  background: rgba(212,175,55,0.10); border:1px solid var(--line);
  color: var(--gold-soft); font-size:16px; cursor:pointer;
}
.theme-toggle:hover{ background: rgba(212,175,55,0.2); }
.eyebrow{ font-size: 13px; letter-spacing: 1px; color: var(--muted); margin-bottom: 6px; }
h1{
  font-family: 'Noto Sans Arabic', sans-serif;
  font-weight: 700;
  font-size: clamp(30px, 6vw, 44px);
  color: var(--gold-soft);
  text-shadow: 0 0 30px rgba(212,175,55,0.15);
}
.sub{ color: var(--muted); font-size: 15px; margin-top: 6px; }

.section-title{
  font-family:'Noto Sans Arabic'; font-weight:800; font-size: 18px;
  color: var(--gold-soft); margin: 30px 4px 12px;
  display:flex; align-items:center; gap:8px;
}

/* ---------- Day arc ---------- */
.arc-box{
  background: linear-gradient(180deg, rgba(29,39,69,0.7), rgba(15,21,38,0.4));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 14px 8px;
  margin: 22px 0 30px;
  position: relative;
}
.arc-box svg{ width:100%; height: auto; display:block; }
.arc-path{ fill:none; stroke: url(#arcGrad); stroke-width: 2; stroke-dasharray: 4 6; opacity:0.6; }
.sun-dot{ filter: drop-shadow(0 0 8px rgba(233,206,124,0.9)); }
.prayer-dot{ fill: var(--card); stroke: var(--gold); stroke-width:1.5; }
.prayer-dot.done{ fill: var(--teal); stroke: var(--teal-soft); }
.prayer-label{ font-size:11px; fill: var(--muted); }
.prayer-time{ font-size:10px; fill: var(--gold-soft); }
.arc-refresh{ position:absolute; top:10px; left:10px; font-size:11px; color:var(--muted); background:none; border:none; cursor:pointer; }
.arc-refresh:hover{ color: var(--gold-soft); }

/* ---------- Grid ---------- */
.grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 780px){ .grid{ grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 520px){ .grid{ grid-template-columns: 1fr; } }

.card{
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  display:flex; flex-direction:column; gap: 10px;
  transition: border-color .2s ease;
}
.card:hover{ border-color: rgba(212,175,55,0.4); }
.card-head{ display:flex; align-items:center; gap:10px; }
.icon{
  width: 36px; height:36px; border-radius: 10px;
  display:flex; align-items:center; justify-content:center; font-size: 18px;
  background: rgba(212,175,55,0.12); border: 1px solid var(--line); flex-shrink:0;
}
.card h2{ font-family:'Noto Sans Arabic'; font-weight:700; font-size: 17px; color: var(--ivory); }
.card .hint{ font-size:12px; color:var(--muted); margin-top:-6px; }

.btn{
  border:1px solid var(--line); background: rgba(212,175,55,0.10); color: var(--gold-soft);
  font-family:'Noto Sans Arabic'; font-weight:600; font-size: 13px; padding: 9px 14px; border-radius: 10px;
  cursor:pointer; text-align:center; text-decoration:none; display:inline-block;
  transition: background .15s ease, transform .1s ease;
}
.btn:hover{ background: rgba(212,175,55,0.2); }
.btn:active{ transform: scale(0.97); }
.btn.teal{ background: rgba(76,145,132,0.15); color: var(--teal-soft); border-color: rgba(76,145,132,0.3); }
.btn.teal:hover{ background: rgba(76,145,132,0.28); }
.btn.small{ padding:6px 10px; font-size:12px; }
.btn.ghost{ background:transparent; }

.tabs{ display:flex; gap:6px; flex-wrap:wrap; row-gap:6px; }
select{ background: rgba(0,0,0,0.2); border:1px solid var(--line); color:var(--ivory); font-family:'Noto Sans Arabic'; font-size:11px; border-radius:6px; padding:5px 4px; }
.tab{
  flex:1; text-align:center; padding:7px 8px; border-radius:8px; font-size:12.5px;
  font-family:'Noto Sans Arabic'; font-weight:600; cursor:pointer; color:var(--muted);
  background: rgba(255,255,255,0.04); border:1px solid transparent;
}
.tab.active{ color:var(--gold-soft); background: rgba(212,175,55,0.12); border-color: var(--line); }

input[type=text], input[type=number], input[type=url]{
  background: rgba(0,0,0,0.2); border: 1px solid var(--line); color: var(--ivory);
  font-family:'Noto Sans Arabic'; font-size: 13px; padding: 8px 10px; border-radius: 8px; width:100%;
}
input:focus{ outline: 2px solid var(--gold); outline-offset:1px; }

.row{
  display:flex; align-items:center; gap: 8px; font-size: 13.5px; padding: 6px 0;
  border-bottom: 1px dashed rgba(255,255,255,0.06);
}
.row:last-child{ border-bottom:none; }
.row label{ flex:1; cursor:pointer; }
.row.done label{ color: var(--muted); text-decoration: line-through; }
.adhkar-row.done label{ color:inherit !important; text-decoration:none !important; opacity:1 !important; filter:none !important; font-size:inherit !important; }
input[type=checkbox]{ width:18px; height:18px; accent-color: var(--teal); cursor:pointer; flex-shrink:0; }

.progress-track{ height: 8px; background: rgba(255,255,255,0.08); border-radius: 6px; overflow:hidden; }
.progress-fill{ height:100%; background: linear-gradient(90deg, var(--teal), var(--teal-soft)); border-radius:6px; transition: width .3s ease; }
.progress-text{ font-size:12px; color: var(--muted); text-align:center; }

.add-row{ display:flex; gap:6px; align-items:center; }
.add-row input{ flex:1; }
.task-list{ max-height: 170px; overflow-y:auto; }
.remove-x{ color: var(--muted); cursor:pointer; font-size:16px; flex-shrink:0; width:20px; text-align:center; }
.remove-x:hover{ color:#d97757; }
.rec-flag{ font-size:11px; color:var(--gold-soft); flex-shrink:0; }
.tiny-check{ display:flex; align-items:center; gap:4px; font-size:11px; color:var(--muted); white-space:nowrap; }

audio{ width:100%; height:36px; filter: invert(0.85) sepia(0.3) saturate(2) hue-rotate(180deg); border-radius:8px; }

.book-item, .pod-item{ padding:10px 0; border-bottom: 1px dashed rgba(255,255,255,0.06); }
.book-item:last-child, .pod-item:last-child{ border-bottom:none; }
.book-item-top{ display:flex; justify-content:space-between; align-items:center; gap:6px; margin-bottom:6px; }
.book-item-top b{ font-size:13.5px; font-family:'Noto Sans Arabic'; }
.book-nums{ display:flex; gap:6px; align-items:center; font-size:12px; color:var(--muted); }
.book-nums input{ width:55px; padding:4px 6px; text-align:center; }
.book-links{ display:flex; gap:6px; margin-top:6px; }

footer{ text-align:center; color: var(--muted); font-size: 12px; margin-top: 34px; line-height:1.9; }
.footer-line{ font-family:'Noto Sans Arabic'; font-size:15px; color: var(--gold-soft); margin-top:6px; }

.loading{ text-align:center; color:var(--muted); padding: 40px; font-size:14px; }

/* ---------- Calendar ---------- */
.cal-box{
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px;
}
.cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.cal-head h3{ font-family:'Noto Sans Arabic'; font-size:15px; }
.cal-nav{ display:flex; gap:8px; }
.cal-nav button{
  background: rgba(212,175,55,0.1); border:1px solid var(--line); color:var(--gold-soft);
  width:30px; height:30px; border-radius:8px; cursor:pointer; font-size:14px;
}
.cal-grid{ display:grid; grid-template-columns: repeat(7, 1fr); gap:6px; }
.cal-dow{ text-align:center; font-size:11px; color:var(--muted); padding-bottom:4px; }
.cal-cell{
  min-height:76px; border-radius:10px; background: rgba(255,255,255,0.03);
  border: 1px solid var(--line); padding:6px; display:flex; flex-direction:column; gap:2px;
  font-size:12.5px; color:var(--ivory); cursor:pointer; position:relative; overflow:hidden;
}
.cal-cell.empty{ background:none; border-color:transparent; cursor:default; }
.cal-cell.today{ border-color: var(--gold); border-width:2px; }
.cal-cell.selected{ outline: 2px solid var(--gold-soft); }
.cal-cell.past{ opacity:0.55; }
.cal-cell-top{ display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
.cal-score{ font-size:9px; font-weight:800; padding:1px 5px; border-radius:8px; color:#fff; margin-inline-start:auto; }
.cal-date-num{ font-weight:700; font-size:13px; }
.cal-dow-mini{ font-size:9px; color:var(--muted); }
.cal-note-preview{
  font-size:10px; line-height:1.25; margin-top:2px; color:var(--ivory);
  overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
}
@media (max-width:560px){
  .cal-grid{ grid-template-columns: 1fr; }
  .cal-dow{ display:none; }
  .cal-cell{ flex-direction:row; align-items:center; min-height:auto; padding:10px; gap:10px; }
  .cal-cell-top{ flex-shrink:0; min-width:76px; }
  .cal-note-preview{ -webkit-line-clamp:2; flex:1; margin-top:0; }
}
.day-stats{ margin-bottom:10px; padding:10px; background: rgba(0,0,0,0.15); border-radius:8px; font-size:12px; }
.day-stat-row{ display:flex; justify-content:space-between; padding:3px 0; }
.day-stat-pct{ margin-top:6px; font-weight:700; color:var(--gold-soft); text-align:center; }
.cal-editor{ margin-top:14px; background: rgba(0,0,0,0.15); border-radius:10px; padding:12px; }
.cal-editor textarea{
  width:100%; min-height:70px; background: rgba(0,0,0,0.2); border:1px solid var(--line);
  color:var(--ivory); border-radius:8px; padding:8px; font-family:'Noto Sans Arabic'; font-size:13px; resize:vertical;
}
.swatches{ display:flex; gap:8px; margin: 10px 0; }
.swatch{ width:26px; height:26px; border-radius:50%; cursor:pointer; border:2px solid transparent; }
.swatch.selected{ border-color: var(--ivory); }
.cal-editor-actions{ display:flex; gap:8px; margin-top:8px; }
.cal-stats{ font-size:12px; color:var(--muted); margin-top:10px; text-align:center; }
.cal-agenda{ margin-top:16px; }
.cal-agenda-col h4{ font-size:12px; color:var(--gold-soft); margin-bottom:6px; font-family:'Noto Sans Arabic'; }
.cal-agenda-item{ font-size:11.5px; padding:5px 0; border-bottom:1px dashed rgba(255,255,255,0.06); cursor:pointer; }
.cal-agenda-item:hover{ color:var(--gold-soft); }

<body>
<div class="wrap">
  <header>
    <button class="theme-toggle" id="themeToggle" title="تبديل المظهر">🌙</button>
    <div class="eyebrow" id="dateLine">…</div>
    <h1 id="greeting">صباح الخير</h1>
    <div class="sub">Nova- مساعدج الشخصي</div>
  </header>

  <div class="today-task-reminder" id="todayTaskReminder" data-section="tasks" role="button" tabindex="0"></div>

  <div class="arc-box">
    <button class="arc-refresh" id="refreshTimes">↻ تحديث أوقات الصلاة</button>
    <svg viewBox="0 0 800 190" id="arcSvg">
      <defs>
        <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#CDAAFE"/>
          <stop offset="50%" stop-color="#BCFFED"/>
          <stop offset="100%" stop-color="#795098"/>
        </linearGradient>
      </defs>
      <path id="dayPath" class="arc-path" d="M40,150 Q400,0 760,150"></path>
      <g id="prayerMarkers"></g>
      <g id="sunMarker"></g>
    </svg>
  </div>


  <div class="grid" id="grid">
    <div class="loading">جارٍ تحميل يومك…</div>
  </div>

  <div class="section-view" id="sectionView" hidden>
    <div class="section-view-head">
      <button class="btn small ghost" id="backHome">← الرئيسية</button>
      <h2 id="sectionViewTitle"></h2>
    </div>
    <div id="sectionViewContent"></div>
  </div>

  <div class="section-title">🗓️ رزنامة الشهر</div>
  <div class="cal-box" id="calBox"></div>

  <footer>
    يُحفظ تقدمك تلقائياً على هذا الجهاز، ويتجدد مع كل يوم جديد 🌙
    <div class="footer-line">الدنيا لسه بخير وكله هيتراضى</div>
  </footer>
</div>

<script>
const dateKey = new Date().toISOString().slice(0,10);
const dateLabel = new Date().toLocaleDateString('ar-KW', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
document.getElementById('dateLine').textContent = dateLabel;

// ---------- Greeting & time-of-day background ----------
function updateGreeting(){
  const h = new Date().getHours();
  let g;
  if (h >= 4 && h < 12) g = 'صباح الخير';
  else if (h >= 12 && h < 20) g = 'قومي يا بت شوفي شغلك';
  else g = 'تصبحين على خير';
  const title=document.getElementById('greeting');
  if(title) title.textContent=g;
}
function updatePeriod(){
  const h = new Date().getHours();
  let period;
  if (h >= 4 && h < 7) period = 'dawn';
  else if (h >= 7 && h < 12) period = 'morning';
  else if (h >= 12 && h < 17) period = 'afternoon';
  else if (h >= 17 && h < 20) period = 'sunset';
  else period = 'night';
  document.documentElement.setAttribute('data-period', period);
}
function updateTimeBased(){ updateGreeting(); updatePeriod(); }
updateTimeBased();
setInterval(updateTimeBased, 5*60*1000);

// ---------- Storage helpers ----------
async function loadJSON(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    return raw !== null ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
async function saveJSON(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }
  catch(e){ console.error('storage error', e); }
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

// ---------- Theme ----------
async function initTheme(){
  const saved = await loadJSON('themeMode', 'dark');
  document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('themeToggle').textContent = saved === 'dark' ? '🌙' : '☀️';
  document.getElementById('themeToggle').onclick = async ()=>{
    const cur = document.documentElement.getAttribute('data-theme') || 'dark';
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    document.getElementById('themeToggle').textContent = next === 'dark' ? '🌙' : '☀️';
    await saveJSON('themeMode', next);
  };
}
initTheme();

// ---------- Defaults ----------
const DEFAULT_TIMES = { fajr:'04:20', dhuhr:'11:35', asr:'14:55', maghrib:'17:45', isha:'19:10' };
const PRAYER_LABELS = { fajr:'الفجر', dhuhr:'الظهر', asr:'العصر', maghrib:'المغرب', isha:'العشاء' };
const CAL_COLORS = { gold:'#D4AF37', teal:'#4C9184', rose:'#C97064', blue:'#5C86B8', none:null };

let state = {};

async function fetchKuwaitTimes(){
  const cacheKey = 'prayerTimesFetched:'+dateKey;
  const cached = await loadJSON(cacheKey, null);
  if(cached) return cached;
  try{
    const now = new Date();
    const dd = String(now.getDate()).padStart(2,'0');
    const mm = String(now.getMonth()+1).padStart(2,'0');
    const yyyy = now.getFullYear();
    const url = `https://api.aladhan.com/v1/timingsByCity/${dd}-${mm}-${yyyy}?city=Kuwait%20City&country=Kuwait&method=9`;
    const res = await fetch(url);
    const json = await res.json();
    const t = json.data.timings;
    const clean = s => (s.match(/\d{2}:\d{2}/)||[s])[0];
    const times = {
      fajr: clean(t.Fajr), dhuhr: clean(t.Dhuhr), asr: clean(t.Asr),
      maghrib: clean(t.Maghrib), isha: clean(t.Isha)
    };
    await saveJSON(cacheKey, times);
    return times;
  }catch(e){
    console.error('prayer time fetch failed', e);
    return { ...DEFAULT_TIMES };
  }
}

async function loadAll(){
  state.times      = await fetchKuwaitTimes();
  state.prayers    = await loadJSON('prayers:'+dateKey, {fajr:false,dhuhr:false,asr:false,maghrib:false,isha:false});
  state.quran      = await loadJSON('quran:'+dateKey, false);

  const defaultFull = [
    'سورة الإخلاص','سورة الفلق','سورة الناس','آية الكرسي',
    'اللهم إني أسألك علمًا نافعًا ورزقًا طيبًا وعملًا متقبلًا',
    'اللهم ما أصبح بي من نعمة أو بأحد من خلقك فمنك وحدك لا شريك لك فلك الحمد ولك الشكر',
    'سبحان الله وبحمده عدد خلقه ورضا نفسه وزنة عرشه ومداد كلماته',
    'لا إله إلا الله وحده لا شريك له له الملك وله الحمد وهو على كل شيء قدير',
    'اللهم عافني في بدني، اللهم عافني في سمعي، اللهم عافني في بصري، لا إله إلا أنت، اللهم إني أعوذ بك من الكفر والفقر وأعوذ بك من عذاب القبر، لا إله إلا أنت',
    'اللهم إني أصبحت أشهدك وأشهد حملة عرشك وملائكتك وجميع خلقك أنك أنت الله لا إله إلا أنت وحدك لا شريك لك وأن محمدًا عبدك ورسولك',
    'اللهم أنت ربي لا إله إلا أنت خلقتني وأنا عبدك وأنا على عهدك ووعدك ما استطعت، أعوذ بك من شر ما صنعت وأبوء لك بنعمتك علي وأبوء بذنبي فاغفر لي فإنه لا يغفر الذنوب إلا أنت',
    'أصبحنا وأصبح الملك لله والحمد لله لا إله إلا الله وحده لا شريك له له الملك وله الحمد وهو على كل شيء قدير، رب أسألك خير ما في هذا اليوم وخير ما بعده وأعوذ بك من شر ما في هذا اليوم وشر ما بعده، رب أعوذ بك من الكسل وسوء الكبر، رب أعوذ بك من عذاب في النار وعذاب في القبر'
  ];
  const defaultShort = [
    'سورة الإخلاص','سورة الفلق','سورة الناس','آية الكرسي',
    'أعوذ بكلمات الله التامات من شر ما خلق',
    'بسم الله الذي لا يضر مع اسمه شيء في الأرض ولا في السماء وهو السميع العليم',
    'سبحان الله وبحمده عدد خلقه ورضا نفسه وزنة عرشه ومداد كلماته',
    'رضيت بالله ربًا وبالإسلام دينًا ومحمدًا رسولًا'
  ];
  // الأذكار محتوى ثابت داخل الموقع، ولا يعتمد على قائمة قابلة للتعديل من localStorage.
  state.adhkarFull  = defaultFull.map((text,i)=>({id:'full-'+(i+1),text}));
  state.adhkarShort = defaultShort.map((text,i)=>({id:'short-'+(i+1),text}));
  state.adhkarView  = 'full';
  const oldAdhkarItems={full:await loadJSON('adhkarItems:full',[]),short:await loadJSON('adhkarItems:short',[])};
  state.adhkarDone  = await loadJSON('adhkarDone:'+dateKey, {full:{}, short:{}});
  // نقل علامات القراءة القديمة إلى المعرفات الثابتة حسب نص الذكر، إن وجدت.
  ['full','short'].forEach(type=>{
    const fixed=type==='full'?state.adhkarFull:state.adhkarShort;
    const old=Array.isArray(oldAdhkarItems[type])?oldAdhkarItems[type]:[];
    const oldMap=state.adhkarDone[type]||{};
    const byText={};old.forEach(x=>{if(x&&x.text)byText[x.text]=!!oldMap[x.id]});
    const migrated={};fixed.forEach(x=>{migrated[x.id]=!!byText[x.text]});
    state.adhkarDone[type]=migrated;
  });
  await saveJSON('adhkarDone:'+dateKey,state.adhkarDone);
  state.adhkarRead  = await loadJSON('adhkarRead:'+dateKey, null);
  // تحويل سجل الإصدارات السابقة إلى حالة واحدة لليوم، بدون احتساب الكاملة والمختصرة كيومين.
  if(state.adhkarRead && typeof state.adhkarRead==='object' && !('completed' in state.adhkarRead)){
    const oldCompleted=!!(state.adhkarRead.full||state.adhkarRead.short);
    state.adhkarRead={completed:oldCompleted,mode:oldCompleted?(state.adhkarRead.full?'full':'short'):null};
    await saveJSON('adhkarRead:'+dateKey,state.adhkarRead);
  }
  if(!state.adhkarRead || typeof state.adhkarRead!=='object') state.adhkarRead={completed:false,mode:null};

  state.books = await loadJSON('books', []);
  state.podcasts = await loadJSON('podcastEpisodes', []);

  state.taskTemplate = await loadJSON('taskTemplate', []);
  state.tasksDaily = await loadJSON('tasksDaily:'+dateKey, {doneIds:{}, extra:[]});
  state.calendarTasks = await loadJSON('calendarTasks', []);

  state.shows = await loadJSON('shows', {freeze:[], done:[], postponed:[], now:[]});
  state.showsView = 'now';

  state.ideas = await loadJSON('ideaBox', []);

  const today = new Date();
  state.calYear = today.getFullYear();
  state.calMonth = today.getMonth();
  state.calNotes = await loadJSON(monthKey(state.calYear, state.calMonth), {});
  state.editingDay = null;
  state.editingColor = 'gold';

  render();
  renderCalendar();
  drawArc();
}

function monthKey(y,m){ return `calnotes:${y}-${String(m+1).padStart(2,'0')}`; }

// ================= Cards =================
function render(){
  const grid = document.getElementById('grid');
  const tiles = [
    ['dawn','🌅','أذكار الصباح'],
    ['quran','📖','سورة الملك'],
    ['prayers','🕌','الصلاة'],
    ['tasks','📝','مهام اليوم'],
    ['books','📚','كتابي'],
    ['shows','📺','مسلسلاتي'],
    ['ideas','💡','صندوق الأفكار'],
    ['podcast','🎧','بودكاست'],
    ['school','🏫','المدرسة'],
    ['pink','💗','pink']
  ];
  grid.innerHTML = tiles.map(([key,icon,title])=>`
    <div class="card home-tile" data-section="${key}" role="button" tabindex="0">
      <div class="card-head"><div class="icon">${icon}</div><div class="tile-title">${title}</div></div>
    </div>`).join('');
  bindHomeNavigation();
  updateTaskReminder();
}
function bindHomeNavigation(){
  document.querySelectorAll('[data-section]').forEach(el=>{
    const open=()=>openSection(el.dataset.section);
    el.onclick=open;
    el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}};
  });
  const r=document.getElementById('todayTaskReminder');
  if(r){r.onclick=()=>openSection('tasks');r.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openSection('tasks');}};}
}
function getCalendarTasksForDate(iso){
  return (state.calendarTasks||[]).filter(t=>t.date===iso);
}
function taskSummary(){
  const calendarToday=getCalendarTasksForDate(dateKey);
  const total=state.taskTemplate.length+state.tasksDaily.extra.length+calendarToday.length;
  const done=state.taskTemplate.filter(t=>state.tasksDaily.doneIds[t.id]).length+
             state.tasksDaily.extra.filter(t=>t.done).length+
             calendarToday.filter(t=>t.done).length;
  return {total,done};
}
function refreshTaskViews(){
  // تحديث واجهة المهام الحالية فورًا بدون مغادرة القسم أو إعادة فتح الموقع.
  const sectionView=document.getElementById('sectionView');
  const content=document.getElementById('sectionViewContent');
  if(sectionView && !sectionView.hidden && content && document.getElementById('sectionViewTitle')?.textContent === sectionTitle('tasks')){
    content.innerHTML = sectionIntro('tasks') + cardTasks();
    bindEvents();
  }
  // تحديث الصفحة الرئيسية ومستطيل تذكير المهام فورًا.
  render();
}
function updateTaskReminder(){
  const el=document.getElementById('todayTaskReminder');
  if(!el) return;
  const {total,done}=taskSummary();
  let msg;
  if(total===0) msg='ما عندج مهام حاليا، أنا جاهز إذا تبين نرتب يومج.';
  else if(done===total) msg=['خلصنا كل مهام اليوم. كفو، شغل مرتب.','كل المهام انجزت. أقدر أعتبر اليوم ناجح؟','ما بقى شي بقائمة اليوم. المهمة تمت بنجاح.','خلص كل شي… الحين عندج وقت لج.'][Math.floor(Math.random()*4)];
  else if(total===1) msg=Math.random()<.5?'في مهمة وحدة بانتظارج، ننجزها؟':'مهمة وحدة بس، ما راح تأخذ منج وايد.';
  else if(total===3) msg='عندج 3 مهام اليوم، خل نبدأ بالأهم.';
  else if(total===5) msg='عندج 5 مهام اليوم، نمشي عليهم وحدة وحدة.';
  else msg='اليوم عندج شوية مهام، يلا ننجزهم مع بعض.';
  el.textContent=msg;
}
function sectionTitle(key){
  return ({dawn:'🌅 أذكار الصباح',quran:'📖 سورة الملك',prayers:'🕌 الصلاة',tasks:'📝 مهام اليوم',books:'📚 كتابي',shows:'📺 مسلسلاتي',ideas:'💡 صندوق الأفكار',podcast:'🎧 بودكاست',school:'🏫 المدرسة',pink:'💗 pink'})[key]||'NOVA';
}
function sectionQuote(key){
  return ({dawn:'ألا بذكر الله تطمئن القلوب',quran:'نور في القلب وبركه في الوقت',prayers:'احفظ الله يحفظك',tasks:'لن يخوض احد معركتك\nشمر… و انزل',books:'صفحه جديده فكره جديده',shows:'الشي الي يونسك لا تفكر فيه مرتين',ideas:'كل شيء عظيم يبداً بفكره',podcast:'شنو بنسمع اليوم 👀؟',school:'يوما ما سأصل إلى ما تمنيت\nوهذا وعد مني لنفسي'})[key]||'';
}
function sectionIntro(key){
  const q=sectionQuote(key);
  return q?`<div class="section-quote">${escapeHtml(q)}</div>`:'';
}
function openSection(key){
  const view=document.getElementById('sectionView'), content=document.getElementById('sectionViewContent');
  document.getElementById('sectionViewTitle').textContent=sectionTitle(key);
  const fn={dawn:cardAdhkar,quran:cardQuran,prayers:cardPrayers,tasks:cardTasks,books:cardBooks,shows:cardShows,ideas:cardIdeas,podcast:cardPodcast,school:schoolView,pink:cardPink}[key];
  if(fn) content.innerHTML=fn();
  else content.innerHTML='';
  const intro=sectionIntro(key);
  if(intro && key!=='school') content.insertAdjacentHTML('afterbegin',intro);
  view.hidden=false;
  document.getElementById('grid').hidden=true;
  document.getElementById('todayTaskReminder').hidden=true;
  bindEvents();
  if(key==='school') bindSchoolEvents();
  if(key==='pink') bindPinkEvents();
  view.scrollIntoView({behavior:'smooth',block:'start'});
}

function closeSection(){
  document.getElementById('sectionView').hidden=true;
  document.getElementById('grid').hidden=false;
  document.getElementById('todayTaskReminder').hidden=false;
}

function cardQuran(){
  return `
  <div class="card">
    <div class="card-head"><div class="icon">📖</div><h2>سورة الملك</h2></div>
    <div class="hint">بصوت الشيخ محمود علي البنا</div>
    <audio id="mulkAudio" controls preload="none" src="https://server8.mp3quran.net/download/bna/067.mp3"></audio>
    <a class="btn" href="https://server8.mp3quran.net/download/bna/067.mp3" target="_blank" rel="noopener">🔊 فتح الصوت مباشرة (لو ما اشتغل المشغّل)</a>
    <button class="btn" type="button" id="openMulkPageBtn">فتح الصفحة الكاملة</button>
    <div class="row">
      <input type="checkbox" id="quranCheck" ${state.quran ? 'checked' : ''}>
      <label for="quranCheck">قرأتها / سمعتها اليوم</label>
    </div>
  </div>`;
}

function adhkarListComplete(type){
  const items = type === 'full' ? state.adhkarFull : state.adhkarShort;
  const doneMap = state.adhkarDone[type] || {};
  return items.length > 0 && items.every(it=>!!doneMap[it.id]);
}
function syncAdhkarCompletion(){
  const type=state.adhkarView;
  const complete=adhkarListComplete(type);
  state.adhkarRead={completed:complete,mode:complete?type:null};
  saveJSON('adhkarRead:'+dateKey,state.adhkarRead);
}
function cardAdhkar(){
  const items = state.adhkarView === 'full' ? state.adhkarFull : state.adhkarShort;
  const doneMap = state.adhkarDone[state.adhkarView] || {};
  const doneCount = items.filter(it=>doneMap[it.id]).length;
  return `
  <div class="card">
    <div class="card-head"><div class="icon">🌅</div><h2>أذكار الصباح</h2></div>
    <div class="tabs">
      <div class="tab ${state.adhkarView==='full'?'active':''}" data-adhkar-tab="full">الأذكار الكاملة</div>
      <div class="tab ${state.adhkarView==='short'?'active':''}" data-adhkar-tab="short">الأذكار المختصرة</div>
    </div>
    <div class="hint">${doneCount} من ${items.length}</div>
    <div class="task-list">${items.map(it=>`
      <div class="row adhkar-row ${doneMap[it.id]?'done':''}">
        <input type="checkbox" data-adhkar="${it.id}" ${doneMap[it.id]?'checked':''}>

function pinkRecords(){return loadJSON('pinkRecords',[]);}
function calcDays(start,end){const a=new Date(start+'T00:00:00'),b=new Date(end+'T00:00:00');if(Number.isNaN(a)||Number.isNaN(b)||b<a)return 0;return Math.floor((b-a)/86400000)+1;}
function pinkPrediction(items){const valid=items.filter(x=>x.start).sort((a,b)=>a.start.localeCompare(b.start));if(valid.length<2)return null;const gaps=[];for(let i=1;i<valid.length;i++){const a=new Date(valid[i-1].start+'T00:00:00'),b=new Date(valid[i].start+'T00:00:00');const g=Math.round((b-a)/86400000);if(g>0)gaps.push(g);}if(!gaps.length)return null;const avg=Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length);const last=new Date(valid.at(-1).start+'T00:00:00');last.setDate(last.getDate()+avg);return {avg,date:last.toISOString().slice(0,10)};}
function pinkMonthName(iso){return iso?new Date(iso+'T00:00:00').toLocaleDateString('ar-KW',{month:'long'}):'pink';}
function cardPink(){const items=JSON.parse(localStorage.getItem('pinkRecords')||'[]').sort((a,b)=>b.start.localeCompare(a.start));const pred=pinkPrediction(items);return `<div class="card pink-card"><div class="card-head"><div class="icon">💗</div><h2>pink</h2></div><form class="school-form" id="pinkForm"><input id="pinkStart" type="date" required><input id="pinkEnd" type="date" required><button class="btn full">إضافة سجل</button></form>${pred?`<div class="school-item pink-prediction"><b>التوقع القادم</b><br><span>${formatArabicDate(pred.date)}</span><small>متوسط الفاصل: ${pred.avg} يوم</small></div>`:''}<div class="school-list">${items.length?items.map(x=>`<div class="school-item pink-item"><div class="school-item-head"><b>${escapeHtml(pinkMonthName(x.start))}</b><div class="school-actions"><button class="btn small" data-pink-edit="${x.id}">تعديل</button><button class="btn small" data-pink-del="${x.id}">حذف</button></div></div><small>من ${formatArabicDate(x.start)} إلى ${formatArabicDate(x.end)} — المدة: ${x.days} أيام</small></div>`).join(''):'<div class="school-empty">ماكو سجلات مضافة للحين</div>'}</div></div>`;}
function formatArabicDate(iso){if(!iso)return '—';return new Date(iso+'T00:00:00').toLocaleDateString('ar-KW',{day:'numeric',month:'long',year:'numeric'});}
function bindPinkEvents(){const f=document.getElementById('pinkForm');if(f)f.onsubmit=e=>{e.preventDefault();const start=document.getElementById('pinkStart').value,end=document.getElementById('pinkEnd').value,days=calcDays(start,end);if(!days)return;const arr=JSON.parse(localStorage.getItem('pinkRecords')||'[]');arr.push({id:uid(),start,end,days});saveJSON('pinkRecords',arr);renderPinkCalendarRefresh();openSection('pink');};document.querySelectorAll('[data-pink-del]').forEach(b=>b.onclick=()=>{const arr=JSON.parse(localStorage.getItem('pinkRecords')||'[]').filter(x=>x.id!==b.dataset.pinkDel);saveJSON('pinkRecords',arr);renderPinkCalendarRefresh();openSection('pink');});document.querySelectorAll('[data-pink-edit]').forEach(b=>b.onclick=()=>{const arr=JSON.parse(localStorage.getItem('pinkRecords')||'[]'),x=arr.find(y=>y.id===b.dataset.pinkEdit);if(!x)return;const start=prompt('تاريخ البداية YYYY-MM-DD',x.start),end=prompt('تاريخ النهاية YYYY-MM-DD',x.end);if(start!==null&&end!==null){const days=calcDays(start,end);if(days){Object.assign(x,{start,end,days});delete x.name;saveJSON('pinkRecords',arr);renderPinkCalendarRefresh();openSection('pink');}}});}
function renderPinkCalendarRefresh(){if(document.getElementById('calBox'))renderCalendar();}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

function bindEvents(){
  const q = document.getElementById('quranCheck');
  if(q) q.onchange = ()=>{ state.quran = q.checked; saveJSON('quran:'+dateKey, state.quran); };
  const openMulkPageBtn = document.getElementById('openMulkPageBtn');
  if(openMulkPageBtn) openMulkPageBtn.onclick=()=>showMulkPage();

  const mulkAudio = document.getElementById('mulkAudio');
  if(mulkAudio) mulkAudio.addEventListener('play', ()=>{
    if(!state.quran){
      state.quran = true;
      if(q) q.checked = true;
      saveJSON('quran:'+dateKey, true);
    }
  });

  document.querySelectorAll('[data-adhkar-tab]').forEach(el=>{
    el.onclick = ()=>{
      state.adhkarView = el.dataset.adhkarTab;
      const content = document.getElementById('sectionViewContent');
      if(content){
        content.innerHTML = sectionIntro('dawn') + cardAdhkar();
        bindEvents();
      }
    };
  });
  document.querySelectorAll('[data-adhkar]').forEach(el=>{
    el.onchange = ()=>{
      const id = el.dataset.adhkar;
      state.adhkarDone[state.adhkarView][id] = el.checked;
      saveJSON('adhkarDone:'+dateKey, state.adhkarDone);
      // أي إزالة لعلامة من قائمة مكتملة تجعل اليوم غير مكتمل، وأي اكتمال للقائمة الحالية يسجله.
      syncAdhkarCompletion();
      const content = document.getElementById('sectionViewContent');
      if(content){
        content.innerHTML = sectionIntro('dawn') + cardAdhkar();
        bindEvents();
      }
    };
  });

  document.querySelectorAll('[data-prayer]').forEach(el=>{
    el.onchange = ()=>{
      state.prayers[el.dataset.prayer] = el.checked;
      saveJSON('prayers:'+dateKey, state.prayers);
      render(); drawArc();
    };
  });

  const addBookBtn = document.getElementById('addBookBtn');
  if(addBookBtn) addBookBtn.onclick = ()=>{
    const title = document.getElementById('newBookTitle').value.trim();
    const pdf = document.getElementById('newBookPdf').value.trim();
    if(!title) return;
    state.books.push({id:uid(), title, page:0, total:0, pdfUrl: pdf});
    saveJSON('books', state.books);
    render();
  };
  document.querySelectorAll('[data-book-page]').forEach(el=>{
    el.onchange = ()=>{
      const b = state.books.find(x=>x.id===el.dataset.bookPage);
      if(b){ b.page = +el.value || 0; saveJSON('books', state.books); render(); }
    };
  });
  document.querySelectorAll('[data-book-total]').forEach(el=>{
    el.onchange = ()=>{
      const b = state.books.find(x=>x.id===el.dataset.bookTotal);
      if(b){ b.total = +el.value || 0; saveJSON('books', state.books); render(); }
    };
  });
  document.querySelectorAll('[data-book-remove]').forEach(el=>{
    el.onclick = ()=>{
      state.books = state.books.filter(b=>b.id!==el.dataset.bookRemove);
      saveJSON('books', state.books); render();
    };
  });
  document.querySelectorAll('[data-book-plus]').forEach(el=>{
    el.onclick = ()=>{
      const b = state.books.find(x=>x.id===el.dataset.bookPlus);
      if(b){ b.page = (b.page||0) + 1; saveJSON('books', state.books); render(); }
    };
  });

  document.querySelectorAll('[data-book-open-local]').forEach(el=>{
    el.onclick = ()=>{
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'application/pdf';
      inp.onchange = ()=>{
        const f = inp.files[0];
        if(f){ const url = URL.createObjectURL(f); window.open(url, '_blank'); }
      };
      inp.click();
    };
  });

  document.querySelectorAll('[data-shows-tab]').forEach(el=>{
    el.onclick = ()=>{ state.showsView = el.dataset.showsTab; render(); };
  });
  const addShowBtn = document.getElementById('addShowBtn');
  if(addShowBtn) addShowBtn.onclick = ()=>{
    const name = document.getElementById('newShowName').value.trim();
    const episodes = +document.getElementById('newShowEpisodes').value || 0;
    if(!name) return;
    state.shows[state.showsView].push({id:uid(), name, episodes});
    saveJSON('shows', state.shows);
    render();
  };
  document.querySelectorAll('[data-show-remove]').forEach(el=>{
    el.onclick = ()=>{
      state.shows[state.showsView] = state.shows[state.showsView].filter(s=>s.id!==el.dataset.showRemove);
      saveJSON('shows', state.shows); render();
    };
  });
  document.querySelectorAll('[data-show-rating]').forEach(el=>{
    el.onchange = ()=>{
      const s = state.shows[state.showsView].find(x=>x.id===el.dataset.showRating);
      if(s){
        let v = +el.value;
        if(v < 1) v = 1; if(v > 10) v = 10;
        s.rating = v || null;
        saveJSON('shows', state.shows); render();
      }
    };
  });
  document.querySelectorAll('[data-show-move]').forEach(el=>{
    el.onchange = ()=>{
      const target = el.value;
      if(!target) return;
      const id = el.dataset.showMove;
      const from = state.showsView;
      const item = state.shows[from].find(s=>s.id===id);
      if(item){
        state.shows[from] = state.shows[from].filter(s=>s.id!==id);
        state.shows[target].push(item);
        saveJSON('shows', state.shows);
        render();
      }
    };
  });

  const addPodBtn = document.getElementById('addPodBtn');
  if(addPodBtn) addPodBtn.onclick = ()=>{
    const name = document.getElementById('newPodName').value.trim();
    const link = document.getElementById('newPodLink').value.trim();
    if(!name) return;
    state.podcasts.push({id:uid(), name, link, done:false, doneDate:null});
    saveJSON('podcastEpisodes', state.podcasts);
    render();
  };
  document.querySelectorAll('[data-pod]').forEach(el=>{
    el.onchange = ()=>{
      const p = state.podcasts.find(x=>x.id===el.dataset.pod);
      if(p){ p.done = el.checked; p.doneDate = el.checked ? dateKey : null; saveJSON('podcastEpisodes', state.podcasts); render(); }
    };
  });
  document.querySelectorAll('[data-pod-remove]').forEach(el=>{
    el.onclick = ()=>{
      state.podcasts = state.podcasts.filter(p=>p.id!==el.dataset.podRemove);
      saveJSON('podcastEpisodes', state.podcasts); render();
    };
  });

  document.querySelectorAll('[data-tmpl-task]').forEach(el=>{
    el.onchange = ()=>{
      state.tasksDaily.doneIds[el.dataset.tmplTask] = el.checked;
      saveJSON('tasksDaily:'+dateKey, state.tasksDaily); refreshTaskViews();
    };
  });
  document.querySelectorAll('[data-tmpl-remove]').forEach(el=>{
    el.onclick = ()=>{
      state.taskTemplate = state.taskTemplate.filter(t=>t.id!==el.dataset.tmplRemove);
      saveJSON('taskTemplate', state.taskTemplate); refreshTaskViews();
    };
  });
  document.querySelectorAll('[data-extra-task]').forEach(el=>{
    el.onchange = ()=>{
      const t = state.tasksDaily.extra.find(x=>x.id===el.dataset.extraTask);
      if(t){ t.done = el.checked; saveJSON('tasksDaily:'+dateKey, state.tasksDaily); refreshTaskViews(); }
    };
  });
  document.querySelectorAll('[data-extra-remove]').forEach(el=>{
    el.onclick = ()=>{
      state.tasksDaily.extra = state.tasksDaily.extra.filter(t=>t.id!==el.dataset.extraRemove);
      saveJSON('tasksDaily:'+dateKey, state.tasksDaily); refreshTaskViews();
    };
  });
  document.querySelectorAll('[data-calendar-task]').forEach(el=>{
    el.onchange=()=>{const arr=state.calendarTasks||[],x=arr.find(t=>t.id===el.dataset.calendarTask);if(x){x.done=el.checked;saveJSON('calendarTasks',arr);refreshTaskViews();}};
  });
  document.querySelectorAll('[data-calendar-task-remove]').forEach(el=>{
    el.onclick=()=>{state.calendarTasks=(state.calendarTasks||[]).filter(t=>t.id!==el.dataset.calendarTaskRemove);saveJSON('calendarTasks',state.calendarTasks);refreshTaskViews();};
  });
  const addTaskBtn = document.getElementById('addTaskBtn');
  const newTaskInput = document.getElementById('newTask');
  function addTask(){
    const val = newTaskInput.value.trim();
    if(!val) return;
    const recurring = document.getElementById('newTaskRecurring').checked;
    if(recurring){
      state.taskTemplate.push({id:uid(), text:val});
      saveJSON('taskTemplate', state.taskTemplate);
    } else {
      state.tasksDaily.extra.push({id:uid(), text:val, done:false});
      saveJSON('tasksDaily:'+dateKey, state.tasksDaily);
    }
    refreshTaskViews();
  }
  if(addTaskBtn) addTaskBtn.onclick = addTask;
  if(newTaskInput) newTaskInput.onkeydown = e=>{ if(e.key==='Enter') addTask(); };

  document.getElementById('refreshTimes').onclick = async ()=>{
    await saveJSON('prayerTimesFetched:'+dateKey, null);
    try{ localStorage.removeItem('prayerTimesFetched:'+dateKey); }catch(e){}
    state.times = await fetchKuwaitTimes();
    render(); drawArc();
  };

  const addIdeaBtn = document.getElementById('addIdeaBtn');
  const newIdeaInput = document.getElementById('newIdea');
  function addIdea(){
    const val = newIdeaInput.value.trim();
    if(!val) return;
    state.ideas.push({id:uid(), text:val});
    saveJSON('ideaBox', state.ideas);
    render();
  }
  if(addIdeaBtn) addIdeaBtn.onclick = addIdea;
  if(newIdeaInput) newIdeaInput.onkeydown = e=>{ if(e.key==='Enter') addIdea(); };
  document.querySelectorAll('[data-idea-remove]').forEach(el=>{
    el.onclick = ()=>{
      state.ideas = state.ideas.filter(i=>i.id!==el.dataset.ideaRemove);
      saveJSON('ideaBox', state.ideas); render();
    };
  });
}

function schoolYears(){
 let years=schoolLoad('years',null);
 if(!Array.isArray(years)||!years.length){years=defaultSchoolYears();schoolSave('years',years);return years}
 years=years.map(y=>({...y,status:y.status||''}));
 const currents=years.filter(y=>y.status==='current');
 if(currents.length>1){const keep=currents[0].id;years.forEach(y=>{if(y.id!==keep&&y.status==='current')y.status=''});}
 schoolSave('years',years);return years;
}
function schoolData(){
 const yearsStored=schoolLoad('years',null);
 if(Array.isArray(yearsStored) && yearsStored.length && !localStorage.getItem('school:yearsUserEdited')){
   const looksLikeOldAuto=yearsStored.length===13 && yearsStored.find(y=>y.id==='g9')?.status==='completed' && yearsStored.find(y=>y.id==='g10')?.status==='current';
   if(looksLikeOldAuto){
     const reset=defaultSchoolYears();
     schoolSave('years',reset);
   }
 }
 let matrix=schoolLoad('scheduleMatrix',null);
 if(!Array.isArray(matrix)||matrix.length!==5||matrix.some(r=>!Array.isArray(r)||r.length!==7)){
  matrix=SCHOOL_DAYS.map(()=>Array(7).fill(''));
  const old=schoolLoad('schedule',[]);
  old.forEach(x=>{const di=SCHOOL_DAYS.indexOf(x.day),pi=Math.max(0,Math.min(6,(Number(x.no)||1)-1));if(di>=0)matrix[di][pi]=x.subject||''});
  schoolSave('scheduleMatrix',matrix);
 }
 return {years:schoolYears(),scheduleMatrix:matrix,grades:schoolLoad('grades',[]),exams:schoolLoad('exams',[]),projects:schoolLoad('projects',[]),tasks:schoolLoad('tasks',[]),attendance:schoolLoad('attendance',[])};
}
function currentSchoolYear(d){return d.years.find(y=>y.status==='current')||null}
function avgGrades(d){if(!d.grades.length)return null;const vals=d.grades.map(x=>Number(x.max)>0?Number(x.score)/Number(x.max)*100:null).filter(v=>v!==null&&!Number.isNaN(v));return vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):null}
function schoolIncompleteCount(arr){return arr.filter(x=>x.status!=='مكتمل'&&x.status!=='تم').length}
function formatSchoolDate(iso){return iso?new Date(iso+'T00:00:00').toLocaleDateString('ar-KW',{day:'numeric',month:'long',year:'numeric'}):'—'}

function schoolDashboard(d){const cur=currentSchoolYear(d),leftTasks=d.tasks.filter(x=>x.status!=='مكتمل').length,leftProjects=d.projects.filter(x=>x.status!=='مكتمل').length;const today=new Date();today.setHours(0,0,0,0);const upcoming=[...d.exams].filter(x=>x.date&&new Date(x.date+'T00:00:00')>=today&&x.status!=='تم').sort((a,b)=>a.date.localeCompare(b.date))[0];return `<h3>لوحة التحكم</h3><div class="school-dashboard-head"><div><span class="hint">السنة الدراسية الحالية</span><b>${escapeHtml(cur?.year||'—')}</b></div><div><span class="hint">الصف الحالي</span><b>${escapeHtml(cur?.name||'—')}</b></div></div><div class="school-count-grid"><div class="school-stat"><b>${leftTasks}</b><span>الواجبات</span></div><div class="school-stat"><b>${leftProjects}</b><span>المشاريع</span></div></div><div class="school-item next-exam"><b>📝 الامتحان القادم</b>${upcoming?`<strong>${escapeHtml(upcoming.subject)}</strong><span>${escapeHtml(upcoming.name)}</span><small>${formatSchoolDate(upcoming.date)} — ${Math.max(0,Math.ceil((new Date(upcoming.date+'T00:00:00')-today)/86400000))} يوم متبقي</small>`:'<span>لا توجد امتحانات قادمة حالياً.</span>'}</div>`}

function gradeSubjects(d){const by={};d.grades.forEach(x=>{if(Number(x.max)>0)(by[x.subject]??=[]).push(Number(x.score)/Number(x.max)*100)});return Object.entries(by).map(([subject,vals])=>({subject,pct:vals.reduce((a,b)=>a+b,0)/vals.length})).sort((a,b)=>b.pct-a.pct)}
function gradeChart(d){const pts=d.grades.filter(x=>Number(x.max)>0);if(!pts.length)return '<div class="school-empty">أضيفي درجات حتى يظهر الرسم البياني.</div>';const W=720,H=220,p=28,vals=pts.map(x=>Number(x.score)/Number(x.max)*100),xy=pts.map((x,i)=>{const xx=p+i*(W-2*p)/Math.max(1,pts.length-1),yy=H-p-(vals[i]/100)*(H-2*p);return [xx,yy,Math.round(vals[i])]}),poly=xy.map(x=>x[0]+','+x[1]).join(' ');return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="تطور الدرجات"><line x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}" stroke="var(--line)"/><polyline points="${poly}" fill="none" stroke="var(--nova-deep)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${xy.map(x=>`<circle cx="${x[0]}" cy="${x[1]}" r="5" fill="var(--nova-purple)"/><text x="${x[0]}" y="${x[1]-10}" text-anchor="middle" font-size="11" fill="var(--ivory)">${x[2]}٪</text>`).join('')}</svg></div>`}
function schoolGrades(d){const subs=gradeSubjects(d),strong=subs.slice(0,3),weak=subs.slice(-3).reverse(),grades=[...d.grades].sort((a,b)=>String(a.subject||'').localeCompare(String(b.subject||''),'ar'));return `<h3>درجاتي</h3><form class="school-form" id="gradeForm"><input id="grSubject" placeholder="المادة" required><input id="grName" placeholder="اسم الاختبار أو التقييم" required><input id="grScore" type="number" min="0" placeholder="الدرجة" required><input id="grMax" type="number" min="1" placeholder="الدرجة الكاملة" required><button class="btn full">إضافة درجة</button></form><div class="school-list">${grades.length?grades.map(x=>`<div class="school-item"><b>${escapeHtml(x.subject)} — ${escapeHtml(x.name)}</b><br><small>${x.score} / ${x.max} = ${Math.round(Number(x.score)/Number(x.max)*100)}٪</small><div class="school-actions"><button class="btn small" data-school-del="grades" data-id="${x.id}">حذف</button></div></div>`).join(''):'<div class="school-empty">أضيفي أول درجة.</div>'}</div><h3 style="margin-top:16px;">📈 أقوى المواد</h3><p class="hint">${strong.map(x=>escapeHtml(x.subject)+' '+Math.round(x.pct)+'٪').join(' — ')||'—'}</p><h3>🎯 المواد التي تحتاج إلى تطوير</h3><p class="hint">${weak.map(x=>escapeHtml(x.subject)+' '+Math.round(x.pct)+'٪').join(' — ')||'—'}</p><h3>تطور الدرجات</h3>${gradeChart(d)}`}

 const gf=document.getElementById('gradeForm');if(gf)gf.onsubmit=e=>{e.preventDefault();const arr=schoolLoad('grades',[]);arr.push({id:schoolId(),subject:document.getElementById('grSubject').value.trim(),name:document.getElementById('grName').value.trim(),score:Number(document.getElementById('grScore').value),max:Number(document.getElementById('grMax').value)});schoolSave('grades',arr);document.getElementById('schoolPanel').innerHTML=schoolPanel('grades',schoolData());bindSchoolEvents();};

function fileToDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
async function tryScheduleOCR(file){const note=document.querySelector('.schedule-help');if(note)note.textContent='جارٍ محاولة قراءة الجدول تلقائيًا… وإذا ما ضبطت، الجدول اليدوي يظل متاحًا بالكامل.';try{if(!window.Tesseract){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s);});}const result=await Tesseract.recognize(file,'ara+eng');const text=result.data.text||'';const m=schoolLoad('scheduleMatrix',SCHOOL_DAYS.map(()=>Array(7).fill('')));const dayMap={'الأحد':0,'الاحد':0,'أحد':0,'الإثنين':1,'الاثنين':1,'إثنين':1,'الثلاثاء':2,'ثلاثاء':2,'الأربعاء':3,'الاربعاء':3,'أربعاء':3,'الخميس':4,'خميس':4};text.split(/\n+/).forEach(line=>{const day=Object.keys(dayMap).find(k=>line.includes(k));if(day){const rest=line.replace(day,'').trim();const parts=rest.split(/\t+|\s{2,}|\|/).map(x=>x.trim()).filter(Boolean);parts.slice(0,7).forEach((v,i)=>m[dayMap[day]][i]=v)}});schoolSave('scheduleMatrix',m);const panel=document.getElementById('schoolPanel');if(panel){panel.innerHTML=schoolPanel('schedule',schoolData());bindSchoolEvents();}}catch(e){console.warn('schedule OCR failed',e);if(note)note.textContent='ما قدرت أقرأ الصورة تلقائيًا، فخليت الجدول اليدوي متاح بالكامل — عدلي الخانات بنفسج.'}}

// ================= Day arc =================
function timeToMinutes(t){ const [h,m] = t.split(':').map(Number); return h*60+m; }
function drawArc(){
  const path = document.getElementById('dayPath');
  const len = path.getTotalLength();
  const fajrM = timeToMinutes(state.times.fajr);
  const ishaM = timeToMinutes(state.times.isha);
  const span = ishaM - fajrM;

  const markersG = document.getElementById('prayerMarkers');
  markersG.innerHTML = '';
  Object.keys(PRAYER_LABELS).forEach(k=>{
    const m = timeToMinutes(state.times[k]);
    let frac = (m - fajrM) / span;
    frac = Math.max(0, Math.min(1, frac));
    const pt = path.getPointAtLength(frac*len);
    const isDone = state.prayers[k];
    markersG.innerHTML += `
      <circle class="prayer-dot ${isDone?'done':''}" cx="${pt.x}" cy="${pt.y}" r="6"></circle>
      <text class="prayer-label" x="${pt.x}" y="${pt.y+22}" text-anchor="middle">${PRAYER_LABELS[k]}</text>
      <text class="prayer-time" x="${pt.x}" y="${pt.y+35}" text-anchor="middle">${state.times[k]}</text>
    `;
  });

  const now = new Date();
  const nowM = now.getHours()*60 + now.getMinutes();
  const sunG = document.getElementById('sunMarker');
  if(nowM < fajrM || nowM > ishaM){
    const frac = nowM < fajrM ? 0 : 1;
    const pt = path.getPointAtLength(frac*len);
    sunG.innerHTML = `<text x="${pt.x}" y="${pt.y-14}" text-anchor="middle" font-size="20">🌙</text>`;
  } else {
    const frac = (nowM - fajrM) / span;
    const pt = path.getPointAtLength(frac*len);
    sunG.innerHTML = `<circle class="sun-dot" cx="${pt.x}" cy="${pt.y}" r="9" fill="#E9CE7C"></circle>`;
  }
}

// ================= Calendar =================
const AR_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const AR_DOW = ['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
const AR_DOW_MINI = ['أح','اث','ثل','أر','خم','جم','سب'];

async function getDayStats(y,m,d){
  const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const p=await loadJSON('prayers:'+iso,null),a=await loadJSON('adhkarRead:'+iso,null),q=await loadJSON('quran:'+iso,null),t=await loadJSON('tasksDaily:'+iso,null);
  const prayersTotal=p?5:0,prayersDone=p?Object.values(p).filter(Boolean).length:0;
  const adhkarDone=a&&((a.completed===true)||(a.full===true)||(a.short===true))?1:0,adhkarTotal=(a!==null)?1:0;
  const calendarTasks=(state.calendarTasks||[]).filter(x=>x.date===iso),dailyTaskTotal=t?(state.taskTemplate.length+(t.extra||[]).length):0,dailyTaskDone=t?(Object.values(t.doneIds||{}).filter(Boolean).length+(t.extra||[]).filter(x=>x.done).length):0;
  const tasksTotal=dailyTaskTotal+calendarTasks.length,tasksDone=dailyTaskDone+calendarTasks.filter(x=>x.done).length;
  const hasQuranRecord=q!==null,quranDone=q===true,ratios=[];
  if(prayersTotal)ratios.push(prayersDone/prayersTotal);if(adhkarTotal)ratios.push(adhkarDone/adhkarTotal);if(tasksTotal)ratios.push(tasksDone/tasksTotal);if(hasQuranRecord)ratios.push(quranDone?1:0);
  if(!ratios.length)return null;return {pct:Math.round(ratios.reduce((a,b)=>a+b,0)/ratios.length*100),prayersDone,prayersTotal,adhkarDone,adhkarTotal,tasksDone,tasksTotal,quranDone,hasQuranRecord};
}
function calendarEventsForDate(iso){
  const d=schoolData(),events=[];
  d.exams.filter(x=>x.date===iso).forEach(x=>events.push({type:'exam',icon:'📝',label:`${x.subject} — ${x.name}`}));
  d.tasks.filter(x=>x.date===iso).forEach(x=>events.push({type:'task',icon:'📚',label:`${x.name} — ${x.subject}`}));
  d.projects.filter(x=>x.date===iso).forEach(x=>events.push({type:'project',icon:'📂',label:`${x.name} — ${x.subject}`}));
  (state.calendarTasks||[]).filter(x=>x.date===iso).forEach(x=>events.push({type:'pin',icon:'📌',label:x.text,done:x.done}));
  const pink=JSON.parse(localStorage.getItem('pinkRecords')||'[]');pink.filter(x=>x.start&&x.end&&iso>=x.start&&iso<=x.end).forEach(x=>events.push({type:'pink',icon:'💗',label:pinkMonthName(x.start)}));
  return events;
}
function scoreColor(pct){if(pct<40)return '#D14F3E';if(pct<70)return '#D4B106';return '#3FA35A'}
async function renderCalendar(){
  const box=document.getElementById('calBox'),y=state.calYear,m=state.calMonth,firstDow=new Date(y,m,1).getDay(),daysInMonth=new Date(y,m+1,0).getDate(),today=new Date(),todayMid=new Date(today.getFullYear(),today.getMonth(),today.getDate()),todayStr=new Date(today.getFullYear(),today.getMonth(),today.getDate()).toISOString().slice(0,10);
  box.innerHTML='<div class="loading" style="padding:30px;">جارٍ حساب سجل الأيام…</div>';
  const statsMap={},promises=[];for(let d=1;d<=daysInMonth;d++){const cd=new Date(y,m,d);if(cd<=todayMid)promises.push(getDayStats(y,m,d).then(s=>statsMap[d]=s))}await Promise.all(promises);state.dayStatsMap=statsMap;
  let cells='';for(let i=0;i<firstDow;i++)cells+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=daysInMonth;d++){const cd=new Date(y,m,d),iso=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,note=state.calNotes[d],isToday=iso===todayStr,isPast=cd<todayMid&&!isToday,isSel=state.editingDay===d,stat=statsMap[d],events=calendarEventsForDate(iso),pink=events.some(e=>e.type==='pink'),color=note&&note.color&&CAL_COLORS[note.color]?CAL_COLORS[note.color]:null,scoreBadge=stat?`<span class="cal-score" style="background:${scoreColor(stat.pct)}">${stat.pct}٪</span>`:'';const chips=events.slice(0,3).map(e=>`<div class="cal-event-chip cal-event-${e.type}">${e.icon} ${escapeHtml(e.label)}</div>`).join('');cells+=`<div class="cal-cell ${isToday?'today':''} ${isSel?'selected':''} ${isPast?'past':''}" data-day="${d}" style="${pink?'background:rgba(231,139,178,.16);border-color:rgba(231,139,178,.55);':color?`background:${color}22;border-color:${color}77;`:''}"><div class="cal-cell-top"><span class="cal-date-num">${d}</span><span class="cal-dow-mini">${AR_DOW_MINI[cd.getDay()]}</span>${scoreBadge}</div>${note&&note.note?`<div class="cal-note-preview">${escapeHtml(note.note)}</div>`:''}<div class="cal-event-list">${chips}</div>${events.length>3?`<div class="cal-event-chip">+${events.length-3} أحداث</div>`:''}</div>`}
  const future=[];for(let d=1;d<=daysInMonth;d++){const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,cd=new Date(y,m,d),ev=calendarEventsForDate(iso);if(cd>=todayMid&&ev.length)future.push({d,events:ev})}const notedDays=Object.keys(state.calNotes).map(Number).sort((a,b)=>a-b),elapsedDays=(y===today.getFullYear()&&m===today.getMonth())?today.getDate():daysInMonth;
  box.innerHTML=`<div class="cal-head"><div class="cal-nav"><button id="calPrev">‹</button></div><h3>${AR_MONTHS[m]} ${y}</h3><div class="cal-nav"><button id="calNext">›</button></div></div><div class="cal-grid">${AR_DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div><div id="calEditorHolder"></div><div class="cal-agenda"><div class="cal-agenda-col"><h4>🔮 الأحداث القادمة</h4>${future.length?future.slice(0,10).map(it=>`<div class="cal-agenda-item" data-jump="${it.d}">${it.d} ${AR_MONTHS[m]} — ${escapeHtml(it.events[0].label)}${it.events.length>1?` (+${it.events.length-1})`:''}</div>`).join(''):'<div class="hint">لا شيء بعد</div>'}</div></div><div class="cal-stats">${notedDays.length} يوم ملاحظات من أصل ${elapsedDays} مضى هذا الشهر</div>`;
  document.getElementById('calPrev').onclick=()=>changeMonth(-1);document.getElementById('calNext').onclick=()=>changeMonth(1);document.querySelectorAll('[data-day]').forEach(el=>el.onclick=()=>openDayEditor(+el.dataset.day));document.querySelectorAll('[data-jump]').forEach(el=>el.onclick=()=>openDayEditor(+el.dataset.jump));if(state.editingDay)renderDayEditor();
}
async function changeMonth(delta){let m=state.calMonth+delta,y=state.calYear;if(m<0){m=11;y--}if(m>11){m=0;y++}state.calMonth=m;state.calYear=y;state.editingDay=null;state.calNotes=await loadJSON(monthKey(y,m),{});renderCalendar()}
function openDayEditor(d){state.editingDay=d;const existing=state.calNotes[d];state.editingColor=existing?(existing.color||'gold'):'gold';renderCalendar()}
function renderDayEditor(){
  const holder=document.getElementById('calEditorHolder'),d=state.editingDay,note=state.calNotes[d]||{note:'',color:'gold'},iso=`${state.calYear}-${String(state.calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,events=calendarEventsForDate(iso),stat=state.dayStatsMap?state.dayStatsMap[d]:null;
  const statsHtml=stat?`<div class="day-stats">${stat.prayersTotal?`<div class="day-stat-row"><span>🕌 الصلاة</span><span>${stat.prayersDone}/${stat.prayersTotal}</span></div>`:''}${stat.adhkarTotal?`<div class="day-stat-row"><span>🌅 الأذكار</span><span>${stat.adhkarDone?'تمت القراءة':'لم تتم القراءة'}</span></div>`:''}${stat.hasQuranRecord?`<div class="day-stat-row"><span>📖 سورة الملك</span><span>${stat.quranDone?'نعم':'لا'}</span></div>`:''}${stat.tasksTotal?`<div class="day-stat-row"><span>📌 المهام</span><span>${stat.tasksDone}/${stat.tasksTotal}</span></div>`:''}<div class="day-stat-pct">إجمالي الإنجاز: ${stat.pct}٪</div></div>`:'';
  const eventsHtml=events.length?`<div class="cal-editor-events"><b>أحداث هذا اليوم</b>${events.map(e=>`<div class="cal-editor-event">${e.icon} ${escapeHtml(e.label)}${e.done?' — مكتملة':''}</div>`).join('')}</div>`:'';
  holder.innerHTML=`<div class="cal-editor"><div class="hint">${AR_DOW[new Date(state.calYear,state.calMonth,d).getDay()]} ${d} ${AR_MONTHS[state.calMonth]}</div>${statsHtml}${eventsHtml}<div class="cal-add-task"><input id="calTaskText" placeholder="مهمة لهذا اليوم"><button class="btn small" id="calAddTaskBtn">+ إضافة مهمة</button></div><textarea id="calNoteText" placeholder="اكتبي ملاحظتك عن هذا اليوم...">${escapeHtml(note.note)}</textarea><div class="swatches">${Object.keys(CAL_COLORS).filter(c=>c!=='none').map(c=>`<div class="swatch ${state.editingColor===c?'selected':''}" data-color="${c}" style="background:${CAL_COLORS[c]}"></div>`).join('')}</div><div class="cal-editor-actions"><button class="btn small" id="calSaveBtn">حفظ</button><button class="btn small ghost" id="calDeleteBtn">حذف</button><button class="btn small ghost" id="calCloseBtn">إغلاق</button></div></div>`;
  document.querySelectorAll('[data-color]').forEach(el=>el.onclick=()=>{state.editingColor=el.dataset.color;renderDayEditor()});
  document.getElementById('calAddTaskBtn').onclick=()=>{const input=document.getElementById('calTaskText'),val=input.value.trim();if(!val)return;state.calendarTasks=state.calendarTasks||[];state.calendarTasks.push({id:uid(),date:iso,text:val,done:false});saveJSON('calendarTasks',state.calendarTasks);renderCalendar();refreshTaskViews()};
  document.getElementById('calSaveBtn').onclick=async()=>{const txt=document.getElementById('calNoteText').value;state.calNotes[d]={note:txt,color:state.editingColor};await saveJSON(monthKey(state.calYear,state.calMonth),state.calNotes);state.editingDay=null;renderCalendar()};
  document.getElementById('calDeleteBtn').onclick=async()=>{delete state.calNotes[d];await saveJSON(monthKey(state.calYear,state.calMonth),state.calNotes);state.editingDay=null;renderCalendar()};
  document.getElementById('calCloseBtn').onclick=()=>{state.editingDay=null;renderCalendar()};
}
